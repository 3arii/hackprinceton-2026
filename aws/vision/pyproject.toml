[project]
name = "microplastics"
version = "0.1.0"
description = "Count and classify microplastics in backlit images of the buoy water intake"
requires-python = ">=3.11"
dependencies = ["numpy", "opencv-python-headless"]

[project.optional-dependencies]
train = ["scikit-learn"]

[project.scripts]
mp = "microplastics.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["microplastics"]
