AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Lake Carnegie buoy monitor - gauges as baseline, buoys as live signal, an agent that decides.

Parameters:
  AlertEmail:
    Type: String
    Default: denizlapsekili@gmail.com
  KeyParam:
    Type: String
    Default: /buoy/anthropic-api-key
  Model:
    Type: String
    Default: claude-haiku-5-5
  DashboardOrigin:
    Type: String
    Default: http://localhost:3000
  StewardUrl:
    Type: String
    Default: ""
    Description: Agent Server URL for the Lake Steward deep agent; empty while it runs locally
  StewardKey:
    Type: String
    Default: ""
    NoEcho: true
  LegacyAgent:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  NodeBuoys:
    Type: String
    Default: "{}"
    Description: 'Hardware mesh node id to buoy number, as JSON, e.g. {"2884855a1da8": 1}'
  HardwareAlerts:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Open investigations for hardware buoys' anomalies (off while they are on the bench)

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 60
    LoggingConfig:
      LogGroup: !Ref Logs
    Environment:
      Variables:
        TABLE: !Ref Table
        BUCKET: !Ref Bucket
        NODE_BUOYS: !Ref NodeBuoys

Resources:
  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /buoy-monitor
      RetentionInDays: 14

  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: expires, Enabled: true }
      SSESpecification: { SSEEnabled: true }

  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - { Id: expire-raw, Status: Enabled, Prefix: raw/, ExpirationInDays: 90 }
      # Uploads from the buoys' Pi gateway reach Lambda through EventBridge
      NotificationConfiguration:
        EventBridgeConfiguration: { EventBridgeEnabled: true }

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Lake Carnegie
      KmsMasterKeyId: alias/aws/sns

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # Pull USGS gauges, weather and NWS alerts into S3 + the baseline record
  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.ingest
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3WritePolicy: { BucketName: !Ref Bucket }
      Events:
        Every15Min:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(15 minutes)
            RetryPolicy: { MaximumRetryAttempts: 1 }

  # Stand-in for buoy hardware: publishes the fleet's readings to IoT Core
  SimulatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.simulate
      Policies:
        - Statement:
            - Effect: Allow
              Action: iot:DescribeEndpoint
              Resource: "*"
            - Effect: Allow
              Action: iot:Publish
              Resource: !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/buoys/*
      Events:
        Every5Min:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(5 minutes)
            RetryPolicy: { MaximumRetryAttempts: 0 }

  # IoT rule target: store, compare to baseline, emit AnomalyDetected
  ReadingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.on_reading
      Environment:
        Variables:
          LOCK_SECONDS: "3600"
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - EventBridgePutEventsPolicy: { EventBusName: default }
      Events:
        BuoyReadings:
          Type: IoTRule
          Properties:
            AwsIotSqlVersion: "2016-03-23"
            Sql: "SELECT * FROM 'buoys/+/readings'"

  # Hardware buoys: the Pi gateway uploads each node's minute of samples to readings/
  UploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.on_upload
      Environment:
        Variables:
          LOCK_SECONDS: "3600"
          HARDWARE_ALERTS: !Ref HardwareAlerts
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3ReadPolicy: { BucketName: !Ref Bucket }
        - EventBridgePutEventsPolicy: { EventBusName: default }
      Events:
        Uploaded:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: [aws.s3]
              detail-type: [Object Created]
              detail:
                bucket: { name: [!Ref Bucket] }
                object: { key: [{ prefix: readings/ }] }
            RetryPolicy: { MaximumRetryAttempts: 2 }

  # Labels every buoy camera photo with that camera's clean-mesh model (vision/; models in the bucket)
  VisionLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      Description: numpy, OpenCV and the microplastics package, built by deploy.sh
      ContentUri: .build/vision/
      CompatibleRuntimes: [python3.13]
      CompatibleArchitectures: [arm64]

  PhotoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: camera.on_photo
      Layers: [!Ref VisionLayer]
      MemorySize: 1024
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3ReadPolicy: { BucketName: !Ref Bucket }
        - Statement:  # the model it learns when the camera's view changes
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${Bucket.Arn}/models/*"
      Events:
        Uploaded:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: [aws.s3]
              detail-type: [Object Created]
              detail:
                bucket: { name: [!Ref Bucket] }
                object: { key: [{ prefix: images/ }] }
            RetryPolicy: { MaximumRetryAttempts: 2 }

  # The agent: gathers evidence, decides, alerts
  AgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: agent.dispatch
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          STEWARD_URL: !Ref StewardUrl
          STEWARD_KEY: !Ref StewardKey
          LEGACY_AGENT: !Ref LegacyAgent
          MODEL: !Ref Model
          KEY_PARAM: !Ref KeyParam
          ALERT_TOPIC: !Ref AlertTopic
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3WritePolicy: { BucketName: !Ref Bucket }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt AlertTopic.TopicName }
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${KeyParam}
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals: { kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com" }
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      Events:
        Anomaly:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: [buoy.monitor]
              detail-type: [AnomalyDetected]
            RetryPolicy: { MaximumRetryAttempts: 0 }

  # Read-only dashboard API
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.api
      Timeout: 10
      Environment:
        Variables:
          DEBUG_TOKEN_PARAM: /buoy/debug-token
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref Table }
        - Statement:
            - Effect: Allow
              Action: iot:DescribeEndpoint
              Resource: "*"
            - Effect: Allow
              Action: iot:Publish
              Resource: !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/buoys/*
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/buoy/debug-token
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals: { kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com" }
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: [!Ref DashboardOrigin]
          AllowMethods: [GET]

Outputs:
  ApiUrl:
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  Bucket:
    Value: !Ref Bucket
  Table:
    Value: !Ref Table
  AlertTopic:
    Value: !Ref AlertTopic
