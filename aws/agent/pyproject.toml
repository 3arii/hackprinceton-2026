[project]
name = "lake-steward"
version = "0.1.0"
description = "Deep agent that investigates Lake Carnegie buoy anomalies"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deepagents==0.7.38",
    "langchain-anthropic",
    "langgraph-sdk",
    "boto3",
    "botocore[crt]",
    "httpx",
    "networkx",
    "numpy",
    "rasterio",
    "pillow",
]

[dependency-groups]
dev = ["langgraph-cli[inmem]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["steward"]
